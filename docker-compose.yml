# NEBULA on QNAP Container Station (or any Docker host).
#
#   1) Clone this repo onto the NAS (e.g. /share/Container/nebula).
#   2) Copy .env.example to .env and fill in REPO_URL + GITHUB_TOKEN if you want
#      automatic updates from your private repo (optional).
#   3) Container Station -> Create Application -> paste/point to this file,
#      or on a shell:  docker compose up -d --build
#
# QNAP gives the container its own IP on the LAN, so the app listens on port 80
# and you reach it at  http://<container-ip>/
services:
  nebula:
    build: .
    image: nebula:latest
    container_name: nebula
    restart: unless-stopped

    ports:
      - "80:80"

    environment:
      NEBULA_PORT: "80"
      NEBULA_DATA: /data
      TZ: ${TZ:-Europe/Berlin}
      # ---- self-update on every start ----
      AUTO_UPDATE: "true"
      REPO_URL: ${REPO_URL:-}          # e.g. https://github.com/you/nebula.git
      REPO_BRANCH: ${REPO_BRANCH:-main}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}  # fine-grained PAT (read-only) for a private repo

    volumes:
      - nebula-data:/data              # database, secrets, cache, downloads
      # ---- mount your NAS media libraries read-only, then point the app's
      #      "Library folders" at them (e.g. /media/Serien) ----
      # - /share/Multimedia:/media:ro

    # ---- DLNA / casting / nebula.local need multicast on the LAN. If discovery
    #      doesn't work with the bridge above, use host networking instead:
    #      comment out "ports:" above and uncomment the line below.
    # network_mode: host

volumes:
  nebula-data:
